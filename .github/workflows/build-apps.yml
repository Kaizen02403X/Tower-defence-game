name: Build apps

# Builds the installable apps: Android (.apk), Windows (.exe), Mac (.dmg) and iPhone (.ipa).
#  - Run it by hand: GitHub → Actions → "Build apps" → Run workflow.
#  - Or push a version tag (git tag v1.0.0 && git push origin v1.0.0) to also publish a Release.
# Each job is independent, so one platform failing does not stop the others.

on:
  workflow_dispatch:
  push:
    branches: ["add-pwa-support"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Create the Android project
        run: npx cap add android
      - name: App icon and splash screen
        run: >
          npx capacitor-assets generate --android
          --iconBackgroundColor '#10151e' --iconBackgroundColorDark '#10151e'
          --splashBackgroundColor '#10151e' --splashBackgroundColorDark '#10151e'
      - name: Make the app fullscreen
        run: node scripts/customize-android.mjs
      - name: Copy the game into the app
        run: npx cap sync android
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LastLight-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LastLight-Android
          path: LastLight-android.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build the installer
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: LastLight-Windows
          path: dist/LastLight-Setup-*.exe
          if-no-files-found: error

  mac:
    name: Mac installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build the .dmg files (Apple Silicon and Intel)
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: LastLight-Mac
          path: dist/LastLight-*.dmg
          if-no-files-found: error

  ios:
    name: iPhone app (unsigned)
    runs-on: macos-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install dependencies
        run: npm install
      - name: Create the iOS project
        run: npx cap add ios
      - name: App icon and splash screen
        run: >
          npx capacitor-assets generate --ios
          --iconBackgroundColor '#10151e' --iconBackgroundColorDark '#10151e'
          --splashBackgroundColor '#10151e' --splashBackgroundColorDark '#10151e'
      - name: Make the app fullscreen
        run: bash scripts/customize-ios.sh
      - name: Copy the game into the app
        run: npx cap sync ios
      - name: Build the app (no signing)
        working-directory: ios/App
        run: |
          if [ -d App.xcworkspace ]; then TARGET=(-workspace App.xcworkspace); else TARGET=(-project App.xcodeproj); fi
          xcodebuild archive "${TARGET[@]}" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/LastLight.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package the .ipa
        run: |
          cd ios/App/build/LastLight.xcarchive/Products/Applications
          mkdir Payload
          cp -R ./*.app Payload/
          zip -qr "$GITHUB_WORKSPACE/LastLight-iOS-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LastLight-iPhone
          path: LastLight-iOS-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish a Release
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [android, windows, mac, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
